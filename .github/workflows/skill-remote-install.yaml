name: skill-install-safety
on:
  push:
    paths: ["install-paperplot-skill.sh", "paperplot-skills/**", ".github/workflows/skill-remote-install.yaml"]
  pull_request:
    paths: ["install-paperplot-skill.sh", "paperplot-skills/**", ".github/workflows/skill-remote-install.yaml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  missing-runtime-is-safe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refuse incomplete runtime without replacing a working installation
        shell: bash
        run: |
          destination="$(mktemp -d)"
          mkdir "$destination/paperplot-skills"
          echo preserved > "$destination/paperplot-skills/old-marker"
          if PAPERPLOT_DEST="$destination" PAPERPLOT_SOURCE_DIR="$PWD/paperplot-skills" PAPERPLOT_ENV="$destination/absent-runtime" PAPERPLOT_OVERWRITE=1 sh install-paperplot-skill.sh; then
            echo 'ERROR: missing runtime was accepted'
            exit 1
          fi
          test "$(cat "$destination/paperplot-skills/old-marker")" = preserved
      - name: Full installed-runtime acceptance is separate
        run: echo 'Actual clean/upgrade exports and rollback tests require the locked runtime and run under formal-render; this job tests failure safety only.'

name: paperplot-skills

'on':
  push:
    branches: [main, master]
    paths:
      - "paperplot-skills/**"
      - "R/**"
      - "DESCRIPTION"
      - "NAMESPACE"
      - ".github/workflows/paperplot-skills.yaml"
  pull_request:
    branches: [main, master]
    paths:
      - "paperplot-skills/**"
      - "R/**"
      - "DESCRIPTION"
      - "NAMESPACE"
      - ".github/workflows/paperplot-skills.yaml"
  workflow_dispatch:

jobs:
  validate-paperplot-skills:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            local::.
            any::patchwork

      - name: Install and verify Arial dependencies
        run: |
          sudo apt-get update
          echo 'ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true' | sudo debconf-set-selections
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y poppler-utils fontconfig ttf-mscorefonts-installer
          sudo fc-cache -f
          test "$(fc-match -f '%{family[0]}|%{style[0]}' 'Arial:style=Regular')" = 'Arial|Regular'
          test "$(fc-match -f '%{family[0]}|%{style[0]}' 'Arial:style=Bold')" = 'Arial|Bold'
          test "$(fc-match -f '%{family[0]}|%{style[0]}' 'Arial:style=Italic')" = 'Arial|Italic'
          test "$(fc-match -f '%{family[0]}|%{style[0]}' 'Arial:style=Bold Italic')" = 'Arial|Bold Italic'

      - name: Validate skill structure
        run: Rscript paperplot-skills/scripts/validate-skill.R

      - name: Smoke test R templates
        run: Rscript paperplot-skills/scripts/smoke-test-templates.R

name: paperplot-skills

'on':
  push:
    branches: [main, master]
    paths:
      - "paperplot-skills/**"
      - "R/**"
      - "DESCRIPTION"
      - "NAMESPACE"
      - ".github/workflows/paperplot-skills.yaml"
  pull_request:
    branches: [main, master]
    paths:
      - "paperplot-skills/**"
      - "R/**"
      - "DESCRIPTION"
      - "NAMESPACE"
      - ".github/workflows/paperplot-skills.yaml"
  workflow_dispatch:

jobs:
  validate-paperplot-skills:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            local::.
            any::patchwork
            any::jsonlite
            any::ggridges
            any::ggrepel
            any::ggbeeswarm

      - name: Validate skill structure
        run: Rscript paperplot-skills/scripts/validate-skill.R
        env:
          PAPERPLOT_MODE: demo

      - name: Set up Python QA
        run: python3 -m pip install Pillow pypdf

      - name: Production contract regression tests
        run: |
          Rscript paperplot-skills/scripts/test-production-contract.R
          python3 paperplot-skills/scripts/test-export-audit.py

      - name: Colour-blind separation of the default palette
        run: Rscript paperplot-skills/scripts/test-palette-cvd.R

      - name: Reject personal paths in committed text
        run: |
          if grep -rIl -e '/Users/' -e 'Documents/1-' \
              --include='*.md' --include='*.json' --include='*.csv' --include='*.R' \
              paperplot-skills README.md; then
            echo 'Committed files must not embed personal or project paths.' >&2
            exit 1
          fi

      - name: Report formal environment capabilities
        run: Rscript paperplot-skills/scripts/check-environment.R
        continue-on-error: true

      - name: Core developer checks (report specialized skips, not acceptance)
        run: |
          Rscript paperplot-skills/scripts/test-recipe-contract.R --core
          python3 paperplot-skills/scripts/catalog.py --check

      - name: Explain formal acceptance boundary
        run: echo 'Core developer checks only. Full 84-recipe/36-template physical and project acceptance runs in the separate formal-render workflow; no manuscript readiness is claimed here.'
